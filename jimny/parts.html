<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181a">
<title>Jimny JB74 改裝零件目錄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Roboto+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#16181a; --panel:#1e2124; --panel-2:#282c30; --ink:#f0f1ee; --ink-2:#9ea49c; --ink-3:#6b7069;
  --rule:#2c3034; --rule-2:#3d4348; --key:#d8cf3a; --key-dim:#3a3814; --key-ink:#16181a; --warn:#e0913c;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Oswald","Helvetica Neue",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
header{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:16px}
.kicker{font:500 9.5px/1 var(--mono);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
h1{font:600 26px/1.1 var(--disp);letter-spacing:.03em;margin:8px 0 0}
header a.back{font:600 13px var(--body);color:var(--key-ink);background:var(--key);padding:10px 14px;border-radius:2px;text-decoration:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 6px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;border-bottom:1px solid var(--rule)}
.chip{font:500 12px var(--body);padding:7px 11px;border:1px solid var(--rule-2);border-radius:20px;background:none;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed=true]{background:var(--key);border-color:var(--key);color:var(--key-ink);font-weight:600}
.bar input{flex:1;min-width:160px;background:var(--panel);color:var(--ink);border:1px solid var(--rule-2);border-radius:2px;padding:8px 10px;font:14px var(--body)}
nav.toc{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 4px;font-size:12.5px}
nav.toc a{color:var(--ink-2);text-decoration:none;border-bottom:1px dotted var(--rule-2)}
section{margin-top:28px}
section h2{font:600 18px/1.2 var(--disp);letter-spacing:.03em;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
section h2 small{font:500 10px var(--mono);color:var(--ink-3);letter-spacing:.1em}
.sub{font-size:12px;color:var(--ink-3);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:6px}
.card.tw{border-color:#4a5a2e}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card b{font:600 14.5px/1.3 var(--body)}
.card .brand{font:500 10px var(--mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-top:2px}
.card .price{font:600 16px/1 var(--disp);white-space:nowrap;text-align:right}
.card .price small{display:block;font:500 9px var(--mono);color:var(--ink-3);letter-spacing:.1em;margin-top:3px}
.card .price.na{color:var(--ink-3);font-size:12px}
.card .note{font-size:12px;color:var(--ink-2);line-height:1.5}
.card .part{font:500 10.5px var(--mono);color:var(--ink-3)}
.card .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.card .acts a{font:600 12px var(--body);padding:6px 10px;border-radius:2px;text-decoration:none;border:1px solid var(--rule-2);color:var(--ink-2)}
.card .acts a.apply{background:var(--key-dim);border-color:var(--key-dim);color:var(--key)}
.tag{font:500 9px var(--mono);letter-spacing:.1em;padding:2px 6px;border-radius:2px;background:var(--panel-2);color:var(--ink-2)}
.tag.tw{background:#2e3a1c;color:#c7d98a}
.tag.unc{background:#2a2113;color:#e0b070}
.empty{color:var(--ink-3);font-size:13px;padding:10px 0}
footer{margin-top:40px;font:500 10.5px/1.7 var(--mono);color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="kicker">SUZUKI · JB74W · 改裝零件目錄</div><h1>Jimny JB74 零件與價格</h1></div>
    <a class="back" href="app.html">← 回 3D 配置器</a>
  </header>
  <div class="bar" id="bar">
    <button class="chip" data-f="all" aria-pressed="true">全部</button>
    <button class="chip" data-f="tw" aria-pressed="false">台灣有售（台幣價）</button>
    <button class="chip" data-f="jp" aria-pressed="false">日本</button>
    <button class="chip" data-f="other" aria-pressed="false">澳洲／歐美</button>
    <input id="q" type="search" placeholder="搜尋品牌、型號、關鍵字…">
  </div>
  <nav class="toc" id="toc"></nav>
  <div id="cats"></div>
  <footer id="foot"></footer>
</div>
<script type="module">
import { LIFTS, WHEELS, TYRES, TYRE_MODELS, FRONT_BUMPERS, REAR_BUMPERS, GRILLES, SNORKELS, MIRRORS,
  ROOF_RACKS, AWNINGS, SIDE_STEPS, LADDERS, OTHERS } from './parts.js';

// key = the configurator's state key, so "套用" can deep-link into app.html
const CATS = [
  ['懸吊舉升', 'lift', LIFTS, '依吋數分組；超過 50mm 需橫樑下降座，3 吋以上需 Caster 修正'],
  ['輪框', 'wheel', WHEELS, '5×139.7、中心孔 108'],
  ['輪胎尺寸', 'tyre', TYRES, '外徑決定舉升需求'],
  ['輪胎型號（胎紋）', 'tread', TYRE_MODELS, '白字＝原廠有 OWL／RWL 版本'],
  ['前保桿', 'frontBumper', FRONT_BUMPERS, ''],
  ['後保桿', 'rearBumper', REAR_BUMPERS, ''],
  ['水箱護罩', 'grille', GRILLES, ''],
  ['車頂架', 'roofRack', ROOF_RACKS, ''],
  ['車邊帳', 'awning', AWNINGS, '台灣左駕：左側＝駕駛側；一般裝副駕（右）側或依露營習慣'],
  ['側踏／岩石滑桿', 'sideStep', SIDE_STEPS, ''],
  ['後爬梯', 'ladder', LADDERS, ''],
  ['呼吸管', 'snorkel', SNORKELS, 'JB74 1.5L 進氣在右側'],
  ['後照鏡', 'mirrors', MIRRORS, ''],
  ['其他配件', null, OTHERS, '目錄用，配置器以開關對應'],
];
const SYM = { TWD: 'NT$', JPY: '¥', AUD: 'A$', USD: 'US$', GBP: '£', EUR: '€', NZD: 'NZ$' };
const region = (it) => it.cur === 'TWD' ? 'tw' : it.cur === 'JPY' ? 'jp' : (it.cur ? 'other' : 'none');
const price = (it) => it.price ? `${SYM[it.cur] ?? ''}${it.price.toLocaleString()}` : (it.price === 0 ? '原廠／—' : '洽詢');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let filter = 'all', query = '';
function card(it, key) {
  const r = region(it);
  const skip = it.id === 'none' || it.id === 'stock' || (it.price === 0 && !it.note);
  if (skip) return '';
  const tags = [r === 'tw' ? '<span class="tag tw">台灣有售</span>' : '', it.uncertain ? '<span class="tag unc">價格／規格待查證</span>' : '',
    it.owl ? '<span class="tag">有白字版</span>' : '', it.inch ? `<span class="tag">${esc(it.inch)}</span>` : ''].join('');
  const apply = key ? `<a class="apply" href="app.html?${key}=${encodeURIComponent(it.id)}${key === 'tread' ? '&owl=' + !!it.owl : ''}">套用到配置器</a>` : '';
  return `<div class="card ${r === 'tw' ? 'tw' : ''}">
    <div class="top"><div><b>${esc(it.label)}</b><div class="brand">${esc(it.brand ?? '')}</div></div>
      <div class="price ${it.price ? '' : 'na'}">${price(it)}<small>${it.cur ?? ''}${it.price && it.cur === 'JPY' ? ' 含稅' : ''}</small></div></div>
    <div>${tags}</div>
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
    ${it.part ? `<div class="part">P/N ${esc(it.part)}</div>` : ''}
    <div class="acts">${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">產品頁 ↗</a>` : ''}${apply}</div>
  </div>`;
}
function matches(it) {
  if (filter !== 'all' && region(it) !== filter) return false;
  if (!query) return true;
  const hay = [it.label, it.brand, it.note, it.part, it.model, it.id].join(' ').toLowerCase();
  return query.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}
function render() {
  let total = 0;
  document.getElementById('cats').innerHTML = CATS.map(([name, key, list, sub]) => {
    const items = list.filter(matches);
    const html = items.map((it) => card(it, key)).join('');
    const n = items.filter((it) => it.id !== 'none' && it.id !== 'stock').length; total += n;
    return `<section id="c-${key ?? 'others'}"><h2>${name}<small>${n} 項</small></h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}
      <div class="grid">${html || '<div class="empty">此篩選下沒有項目</div>'}</div></section>`;
  }).join('');
  document.getElementById('toc').innerHTML = CATS.map(([name, key]) => `<a href="#c-${key ?? 'others'}">${name}</a>`).join('');
  document.getElementById('foot').textContent = `共 ${total} 項。價格為各廠商／通路頁面標示（日本含稅、澳洲含 GST），匯率與運費另計；標「待查證」者為估值。資料日期 2026-09-16。`;
}
document.getElementById('bar').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b));
  render();
});
document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
render();
</script>
</body>
</html>
