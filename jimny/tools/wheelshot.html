<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>wheel thumbnail renderer</title>
<style>html,body{margin:0;background:#111;height:100%}canvas{display:block}</style>
</head>
<body>
<canvas id="cv" width="360" height="360"></canvas>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
}}
</script>
<script type="module">
// Renders one face-on thumbnail per rim style, straight from the same geometry
// the configurator shows. Driven by tools/render_wheels.mjs; the page itself
// is never deployed.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadParts, getPart } from '../accessories.js';
import { buildWheel } from '../wheels.js';

const cv = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 1.25;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8c9096, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(3, 3.4, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(-3, -1, 2.5); scene.add(fill);

// Slightly off dead-centre so the dish and lip read as depth rather than a
// flat disc; the wheel's axis is X, so the face is toward +X.
const cam = new THREE.PerspectiveCamera(22, 1, 0.05, 40);
cam.position.set(3.0, 0.42, 0.78);
cam.lookAt(0, 0, 0);

const group = new THREE.Group();
scene.add(group);

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);

window.__shot = async function (style, rimColor) {
  group.clear();
  const w = buildWheel(THREE, {
    rimDia: 16, tyreDia: 707, width: 215, style, tread: 'at',
    rimColor: rimColor ?? 0xbcc1c6, rimNode: getPart('rim_' + style),
  });
  // buildWheel works in mm-scaled units already; centre it on the origin
  w.position.set(0, 0, 0);
  group.add(w);
  const box = new THREE.Box3().setFromObject(w);
  const r = Math.max(box.max.y - box.min.y, box.max.z - box.min.z) / 2;
  const c = box.getCenter(new THREE.Vector3());
  // frame so the tyre just kisses the edge of the square
  const d = (r * 0.93) / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  const dir = new THREE.Vector3(1, 0.14, 0.26).normalize();
  cam.position.copy(c).addScaledVector(dir, d);
  cam.lookAt(c);
  renderer.render(scene, cam);
  return cv.toDataURL('image/webp', 0.88);
};

await loadParts(loader, '../model/parts.glb', THREE);
window.__ready = true;
</script>
</body>
</html>
