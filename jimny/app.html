<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181a">
<title>Jimny JB74 改裝配置</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Roboto+Mono:wght@500&display=swap">
<style>
:root{
  --stage:#e8eae7; --panel:#16181a; --panel-2:#1e2124; --panel-3:#282c30;
  --ink:#f0f1ee; --ink-2:#9ea49c; --ink-3:#6b7069;
  --rule:#2c3034; --rule-2:#3d4348;
  --key:#d8cf3a; --key-dim:#3a3814; --key-ink:#16181a;
  --warn:#e0913c; --err:#d2593f;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Oswald","Helvetica Neue",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font:15px/1.55 var(--body);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{display:grid;grid-template-columns:1fr 360px;height:100%}
@media(max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:44vh 1fr}}

.stage{position:relative;background:linear-gradient(#f1f2ef 0%,#e6e8e4 55%,#d4d7d2 100%);overflow:hidden;touch-action:none}
#cv{display:block;width:100%;height:100%}
.badge{position:absolute;top:14px;left:16px;pointer-events:none}
.badge .mk{font:500 9.5px/1 var(--mono);letter-spacing:.26em;color:#8b908a}
.badge .md{font:600 21px/1.05 var(--disp);letter-spacing:.04em;color:#22262a;margin-top:4px}
.views{position:absolute;top:12px;right:14px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.views button{font:500 11.5px/1 var(--body);padding:6px 9px;border:1px solid #cfd2ce;border-radius:2px;
  background:#fbfbfaee;color:#3b3f43;cursor:pointer}
.views button[aria-pressed=true]{background:var(--key);border-color:var(--key);color:var(--key-ink);font-weight:600}
.hud{position:absolute;left:16px;bottom:12px;font:500 10.5px/1.65 var(--mono);color:#6e736d;pointer-events:none}
.hud b{color:#22262a}
#boot{position:absolute;inset:0;display:grid;place-items:center;background:var(--stage);z-index:4;
  font:500 13px var(--mono);color:#5d625c;text-align:center;padding:20px}
#boot .bar{width:190px;height:3px;background:#d3d6d1;border-radius:2px;margin:12px auto 0;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:var(--key);transition:width .2s}
.credit{position:absolute;right:14px;bottom:10px;font:500 9.5px/1.5 var(--mono);color:#8d928c;
  text-align:right;max-width:52%}
.credit a{color:#6e736d}

.panel{background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto;-webkit-overflow-scrolling:touch}
.head{padding:18px 20px 16px;border-bottom:1px solid var(--rule)}
.head .kicker{font:500 9.5px/1 var(--mono);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.head h1{font:600 20px/1.15 var(--disp);letter-spacing:.03em;margin:8px 0 0}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:3px;margin-top:14px;overflow:hidden}
.readout div{background:var(--panel-2);padding:9px 10px}
.readout span{display:block;font:500 9px/1 var(--mono);letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.readout b{display:block;font:600 16px/1.2 var(--disp);margin-top:5px;font-variant-numeric:tabular-nums}
.readout small{font-size:10px;font-weight:400;color:var(--ink-3)}

section{border-bottom:1px solid var(--rule)}
.sec-h{display:flex;align-items:center;gap:11px;width:100%;padding:14px 20px;background:none;border:0;
  color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.sec-h .ix{font:600 12px/1 var(--mono);color:var(--key);width:12px;flex:none}
.sec-h .tt{flex:1;min-width:0}
.sec-h .tt b{display:block;font:600 14px/1.2 var(--disp);letter-spacing:.03em}
.sec-h .tt i{display:block;font-style:normal;font-size:11px;color:var(--ink-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-h .ar{color:var(--ink-3);font-size:10px;transition:transform .18s}
.sec-h[aria-expanded=true] .ar{transform:rotate(180deg)}
.sec-b{padding:0 20px 18px;display:none}
.sec-h[aria-expanded=true]+.sec-b{display:block}
.lbl{font:500 9.5px/1 var(--mono);letter-spacing:.13em;color:var(--ink-3);text-transform:uppercase;margin:16px 0 8px;display:block}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--rule-2);
  cursor:pointer;padding:0;position:relative}
.sw[aria-pressed=true]{border-color:var(--key);outline-color:var(--key)}
select{width:100%;background:var(--panel-2);color:var(--ink);border:1px solid var(--rule-2);border-radius:2px;
  padding:10px 11px;font:14px var(--body);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:right 14px top 18px,right 9px top 18px;background-size:5px 5px;background-repeat:no-repeat}
select:focus{outline:2px solid var(--key);outline-offset:-1px}
.hint{font-size:11px;color:var(--ink-3);line-height:1.5;margin:6px 0 0}
.toggles{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.tg{display:flex;align-items:center;justify-content:space-between;gap:9px;background:var(--panel-2);border:0;
  padding:12px;color:var(--ink);cursor:pointer;font:inherit;text-align:left;width:100%}
.tg[aria-pressed=true]{background:var(--key-dim)}
.tg .nm{font-size:13px;min-width:0}
.tg .nm i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg[aria-pressed=true] .nm{color:var(--key)}
.tg .st{font:500 9.5px/1 var(--mono);letter-spacing:.1em;color:var(--ink-3);flex:none}
.tg[aria-pressed=true] .st{color:var(--key)}
.flags{padding:0 20px 16px;display:grid;gap:6px}
.flag{padding:9px 11px;border-radius:2px;font-size:12px;line-height:1.5;border-left:2px solid}
.flag.error{background:#2a1714;border-color:var(--err);color:#f0c4ba}
.flag.warn{background:#2a2113;border-color:var(--warn);color:#f0d8b8}
.flag.info{background:var(--panel-2);border-color:var(--rule-2);color:var(--ink-2)}
.flag b{font:600 9.5px/1.6 var(--mono);letter-spacing:.08em;display:block}
.acts{padding:16px 20px 30px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{padding:12px;border-radius:2px;font:600 13px var(--body);cursor:pointer;border:1px solid}
.ghost{background:none;border-color:var(--rule-2);color:var(--ink-2)}
.solid{background:var(--key);border-color:var(--key);color:var(--key-ink)}
#out{margin:0 20px 22px;background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;padding:12px;
  font:11.5px/1.65 var(--mono);color:var(--ink-2);white-space:pre-wrap;display:none}
#out.on{display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <canvas id="cv"></canvas>

      <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></div>

  <div class="panel">
    <div class="head">
      <div class="kicker">改裝配置器 · <a href="parts.html" style="color:var(--key);text-decoration:none">零件目錄與價格 →</a></div>

        <label class="lbl">輪胎尺寸</label><select id="selTyre"></select><p class="hint" id="hTyre"></p>
        <label class="lbl">輪胎型號</label><select id="selTread"></select><p class="hint" id="hTread"></p>
        <button class="tg" id="tgOwl" aria-pressed="false" style="margin-top:9px;border:1px solid var(--rule)">
          <span class="nm">白字胎邊<i id="owlNote">Outlined White Letters</i></span><span class="st">關閉</span></button>
        <label class="lbl">輪框顏色</label><div class="swatches" id="rimSw"></div>
      </div></section>
    <section><button class="sec-h" aria-expanded="false"><span class="ix">E</span>
      <span class="tt"><b>外觀與配件</b><i id="sumE">原廠</i></span><span class="ar">▾</span></button>
      <div class="sec-b">
        <label class="lbl">車身配色</label><div class="swatches" id="colSw"></div>
        <select id="selColor" style="margin-top:10px"></select>
        <button class="tg" id="tgTwo" aria-pressed="false" style="margin-top:9px;border:1px solid var(--rule)">
          <span class="nm">雙色車頂<i>ZJ3 Bluish Black Pearl</i></span><span class="st">關閉</span></button>
        <label class="lbl">全車套件</label><select id="selKit"></select><p class="hint" id="hKit"></p>
        <label class="lbl">前保桿</label><select id="selBumper"></select><p class="hint" id="hBumper"></p>
        <label class="lbl">水箱護罩</label><select id="selGrille"></select><p class="hint" id="hGrille"></p>
        <label class="lbl">後保桿</label><select id="selRear"></select><p class="hint" id="hRear"></p>
        <label class="lbl">呼吸管</label><select id="selSnorkel"></select><p class="hint" id="hSnorkel"></p>
        <label class="lbl">後照鏡</label><select id="selMirror"></select><p class="hint" id="hMirror"></p>
        <label class="lbl">車頂架</label><select id="selRack"></select><p class="hint" id="hRack"></p>
        <label class="lbl">車邊帳</label><select id="selAwning"></select><p class="hint" id="hAwning"></p>
        <button class="tg" id="tgAwnSide" aria-pressed="false" style="margin-top:9px;border:1px solid var(--rule)">
          <span class="nm">車邊帳安裝側<i>台灣右駕道路習慣裝左側（副駕側）</i></span><span class="st">左側</span></button>
        <label class="lbl">側踏／岩石滑桿</label><select id="selStep"></select><p class="hint" id="hStep"></p>
        <label class="lbl">後爬梯</label><select id="selLadder"></select><p class="hint" id="hLadder"></p>
        <label class="lbl">加裝配件</label><div class="toggles" id="toggles"></div>
      </div></section>
    <div class="flags" id="flags"></div>
    <div class="acts"><button class="ghost" id="btnDemo">載入範例車</button>
      <button class="ghost" id="btnReset">全部還原</button>
      <button class="solid" id="btnExport">匯出這台配置</button></div>
    <pre id="out"></pre>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { rigJimny, applyConfig } from './rig.js?v=202609181708';

import { buildAccessory, loadParts, getPart } from './accessories.js?v=202609181708';
import { buildWheel, loadTreadMasks } from './wheels.js?v=202609181708';
// Written by stamp.sh on each deploy; shown in the HUD so a stale cached copy
// is obvious at a glance.
const BUILD = '202609181708';

const cv = document.getElementById('cv');
// The backdrop is CSS behind a transparent canvas: a background texture in
// the scene fed the ambient-occlusion pass a phantom wall.
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 200);
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

// Image-based light so chrome and paint have something to reflect; without it
// metallic surfaces render as flat dark grey.
// A real photographed environment (Poly Haven "abandoned parking", CC0)
// replaces the synthetic studio: paint, chrome and glass now reflect an
// actual space, which is most of what makes a render read as a photo. The
// studio stays as the fallback until the HDR arrives.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 1.0;
new RGBELoader().load(`model/env.hdr?v=${BUILD}`, (hdr) => {
  scene.environment = pmrem.fromEquirectangular(hdr).texture;
  scene.environmentIntensity = 1.35;
  hdr.dispose();
});
scene.add(new THREE.HemisphereLight(0xffffff, 0xc4c8bf, 0.6));
const kl = new THREE.DirectionalLight(0xffffff, 1.8); kl.position.set(4, 6.5, 4.5);
kl.castShadow = true; kl.shadow.mapSize.set(2048, 2048);
Object.assign(kl.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: .1, far: 26 });
kl.shadow.bias = -0.0005; scene.add(kl);
const fl2 = new THREE.DirectionalLight(0xffffff, 0.5); fl2.position.set(-5, 3, -4); scene.add(fl2);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.ShadowMaterial({ opacity: .18 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
// soft pool of shade under the car, the way a real car darkens the ground around it
{
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d').createRadialGradient(128, 128, 20, 128, 128, 128);
  g.addColorStop(0, 'rgba(0,0,0,0.42)'); g.addColorStop(0.6, 'rgba(0,0,0,0.14)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 4.2),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  pool.rotation.x = -Math.PI / 2; pool.rotation.z = Math.PI / 2; pool.position.y = 0.002; scene.add(pool);
}

// Desktop gets ambient occlusion through a post-processing chain (crevices,
// grille slats and rack slats stop looking pasted on); phones render direct,
// the second scene pass GTAO needs is too much for them.
const HQ = matchMedia('(min-width: 900px)').matches && !/Mobi|Android/i.test(navigator.userAgent);
let composer = null;
if (HQ) {
  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { samples: 4, type: THREE.HalfFloatType }));
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.addPass(new RenderPass(scene, cam));
  const ao = new GTAOPass(scene, cam, 1, 1);
  ao.output = GTAOPass.OUTPUT.Default;
  ao.updateGtaoMaterial({ radius: 0.2, distanceExponent: 1, thickness: 1, scale: 1.1, samples: 16, distanceFallOff: 1 });
  ao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 4, radiusExponent: 1, rings: 2, samples: 16 });
  ao.blendIntensity = 0.9;
  composer.addPass(ao);
  composer.addPass(new OutputPass());
}

const orbit = { az: .8, el: .18, dist: 9, ty: .85 };
function applyCam() {
  orbit.el = Math.max(-.15, Math.min(1.1, orbit.el));
  orbit.dist = Math.max(4.5, Math.min(22, orbit.dist));
  cam.position.set(Math.cos(orbit.el) * Math.sin(orbit.az) * orbit.dist,
    orbit.ty + Math.sin(orbit.el) * orbit.dist, Math.cos(orbit.el) * Math.cos(orbit.az) * orbit.dist);
  cam.lookAt(0, orbit.ty, 0);
}
let drag = null, pinch = 0;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!drag) return;
  orbit.az -= (e.clientX - drag.x) * .008; orbit.el += (e.clientY - drag.y) * .006;
  drag = { x: e.clientX, y: e.clientY }; applyCam(); });
addEventListener('pointerup', () => drag = null);
cv.addEventListener('wheel', e => { e.preventDefault(); orbit.dist *= 1 + Math.sign(e.deltaY) * .09; applyCam(); }, { passive: false });
cv.addEventListener('touchmove', e => { if (e.touches.length !== 2) return; e.preventDefault();
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) { orbit.dist *= pinch / d; applyCam(); } pinch = d; }, { passive: false });
cv.addEventListener('touchend', () => pinch = 0);
function resize() { const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); composer?.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize);
const VIEWS = [['前側', .8, .18, 9], ['側面', Math.PI / 2, .08, 8.6], ['後側', 2.4, .18, 9],
  ['正前', 0, .1, 8], ['俯視', .6, 1.0, 10]];

const DEF = { color: 'ZVL', twoTone: false, lift: 'stock', bodyLift: 'none', wheel: 'oem', tyre: 't195',
  tread: 'toyo_at3', owl: false, rimColor: 0xc8ccd0,
  kit: 'none', frontBumper: 'stock', grille: 'stock', rearBumper: 'stock',
  snorkel: 'none', mirrors: 'stock', pillarPods: false, roofRack: 'none', awning: 'none', awningSide: 'left', windowGuards: false, ladder: 'none',
  sideStep: 'none', lightBar: false, spareBag: false, spareCover: false,
  roofLights: false, guardCan: false, guardBoard: false, shovel: false, flares: false, decals: false, sideSkirt: false };
let S = { ...DEF }, rig = null, accGroup = new THREE.Group();
const RIMS = [0xc8ccd0, 0x373b41, 0x8a6a3c, 0xd8d9d6, 0xb8410f];   // matte black reads as a shade of grey so spokes show
// the owner's own car (from their photos): black JB74 on a 3" lift, 31"
// Open Country M/T white letters on matte-black MAXX wheels
const DEMO = { color: 'ZJ3', lift: 'td60', wheel: 'maxx', tyre: 't225r16', tread: 'toyo_mt', owl: true, rimColor: 0x373b41,
  grille: 'hbar_suzuki', frontBumper: 'tube_heritage', rearBumper: 'klc_heritage_rear', roofRack: 'arb', roofLights: false, awning: 'yakima_270s', awningSide: 'left',
  windowGuards: true, guardCan: true, guardBoard: true, shovel: true, ladder: 'tube', sideStep: 'jst', flares: true, decals: false, sideSkirt: true,
  mirrors: 'damd', pillarPods: true, snorkel: 'bravo' };
// toggle buttons read their state from S, so presets and cycling share one path
function syncToggles() {
  const t = document.getElementById('toggles'); if (!t) return;
  const set = (b, on, txt) => { b.setAttribute('aria-pressed', on); b.querySelector('.st').textContent = txt; };
  const aw = document.getElementById('tgAwnSide'); aw.setAttribute('aria-pressed', S.awningSide === 'right'); aw.querySelector('.st').textContent = S.awningSide === 'left' ? '左側' : '右側';
  t.querySelectorAll('[data-k]').forEach(b => set(b, !!S[b.dataset.k], S[b.dataset.k] ? '已裝' : '未裝'));
  document.querySelectorAll('[data-c]').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === S.color));
  document.querySelectorAll('[data-r]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.r === S.rimColor));
  const owl = document.getElementById('tgOwl'); owl.setAttribute('aria-pressed', S.owl); owl.querySelector('.st').textContent = S.owl ? '開啟' : '關閉';
  const two = document.getElementById('tgTwo'); two.setAttribute('aria-pressed', S.twoTone); two.querySelector('.st').textContent = S.twoTone ? '開啟' : '關閉';
}
const find = (l, id) => l.find(x => x.id === id) || l[0];

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);
const partsReady = Promise.all([loadParts(loader, `model/parts.glb?v=${BUILD}`, THREE), loadTreadMasks(TYRE_MODELS, `model/tread/`)]);
loader.load('model/jimny-hq.glb', async (g) => {
  await partsReady;
  rig = rigJimny(THREE, g.scene);
  rig.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(rig); rig.userData.BODY.add(accGroup);
  // inspection hook for headless verification scripts; harmless in the page
  window.__jimny = { THREE, rig, scene, cam, get composer() { return composer; }, update: () => update(), setOrbit: (o) => { Object.assign(orbit, o); applyCam(); } };
  document.getElementById('boot').style.display = 'none';
  // parts.html links in with ?key=id (booleans as true/false) to preselect a part
  const q = new URLSearchParams(location.search);
  for (const [k, v] of q) if (k in DEF) S[k] = typeof DEF[k] === 'boolean' ? v === 'true' : typeof DEF[k] === 'number' ? +v : v;
  if ([...q.keys()].length) document.querySelectorAll('.sec-h').forEach(b => b.setAttribute('aria-expanded', 'true'));
  buildUI(); update();
}, (p) => { if (p.total) document.getElementById('bootbar').style.width = (p.loaded / p.total * 100) + '%'; },
(e) => { document.getElementById('boot').textContent = '模型載入失敗：' + (e?.message || e); });

function update() {
  const lift = find(LIFTS, S.lift), bl = { body: lift.body ?? 0, label: '' };
  const wh = find(WHEELS, S.wheel), ty = find(TYRES, S.tyre);
  const col = COLORS.find(c => c.code === S.color) || COLORS[3];
  const total = lift.lift + bl.body;
  applyConfig(THREE, rig, {
    bodyColor: col.hex, twoTone: S.twoTone, roofColor: ROOF_BLACK, lift: total,
    tyreDia: ty.dia, tyreWidth: ty.width, rimDia: wh.rim, wheelStyle: wh.style,
    tread: { ...find(TYRE_MODELS, S.tread), owl: S.owl }, rimColor: S.rimColor,
    spacer: Math.max(0, -wh.offset) * 0.7,
    hideBumper: S.frontBumper !== 'stock', hideGrille: S.grille !== 'stock', hideRear: S.rearBumper !== 'stock',
    hideMirrors: S.mirrors !== 'stock', hideFlares: false, hideRearLamps: !!find(REAR_BUMPERS, S.rearBumper).ownLamps,
    buildWheel: (o) => buildWheel(THREE, { ...o, rimNode: getPart('rim_' + o.style) }),
  });

  // Accessories live under BODY so the lift carries them automatically; each
  // is a modelled part already positioned for this car (see accessories.js).
  accGroup.clear();
  const paint = rig.userData.paintMat;
  const add = (n) => n && accGroup.add(n);
  for (const k of ['windowGuards', 'lightBar', 'spareBag', 'spareCover', 'roofLights', 'flares', 'decals', 'shovel', 'sideSkirt'])
    if (S[k]) add(buildAccessory(k, undefined, paint));
  if (S.guardBoard && S.windowGuards) add(buildAccessory('guardBoard', undefined, paint));
  // the snorkel takes the right-hand pillar, so pods go left only when one is fitted
  if (S.pillarPods) add(buildAccessory('pillarPods', S.snorkel !== 'none' ? 'left' : undefined, paint));
  if (S.guardCan && S.windowGuards) add(buildAccessory('guardCan', undefined, paint));
  if (S.ladder !== 'none') add(buildAccessory('ladder', S.ladder, paint));
  if (S.rearBumper !== 'stock') add(buildAccessory('rearBumper', S.rearBumper, paint));
  if (S.snorkel !== 'none') add(buildAccessory('snorkel', S.snorkel, paint));
  if (S.mirrors !== 'stock') add(buildAccessory('mirrors', S.mirrors, paint));
  if (S.roofRack !== 'none') add(buildAccessory('roofRack', S.roofRack, paint));
  if (S.awning !== 'none') add(buildAccessory('awning', `${S.awning}_${S.awningSide}`, paint));
  if (S.sideStep !== 'none') add(buildAccessory('sideStep', S.sideStep, paint));
  if (S.frontBumper !== 'stock') add(buildAccessory('frontBumper', S.frontBumper, paint));
  if (S.grille !== 'stock') add(buildAccessory('grille', S.grille, paint));

  const set = (id, v) => document.getElementById(id).innerHTML = v;
  set('rLift', total + '<small> mm</small>');
  set('rTyre', ty.dia + '<small> mm</small>');
  set('rClear', (210 + total + Math.round((ty.dia - 693) / 2)) + '<small> mm</small>');
  document.getElementById('sumL').textContent = total ? lift.label : '原廠';
  document.getElementById('sumW').textContent = wh.label.replace('原廠 ', '') + ' · ' + ty.label.replace('（原廠）', '');
  const n = ['windowGuards','lightBar','spareBag','spareCover','roofLights','guardCan','guardBoard','shovel','flares','decals','pillarPods','sideSkirt'].filter(k => S[k]).length
    + (S.roofRack !== 'none') + (S.awning !== 'none') + (S.ladder !== 'none') + (S.sideStep !== 'none') + (S.frontBumper !== 'stock') + (S.grille !== 'stock') + (S.rearBumper !== 'stock')
    + (S.snorkel !== 'none') + (S.mirrors !== 'stock');
  document.getElementById('sumE').textContent = col.name + (S.twoTone ? ' 雙色' : '') + (n ? ` · ${n} 項配件` : '');
  document.getElementById('hud').innerHTML = `拖曳旋轉 · 雙指縮放<br><b>${col.name}</b><br>舉升 <b>${total}mm</b> · 胎 <b>${ty.label.replace('（原廠）','')}</b><br>版本 ${BUILD}`;
  const fl = validate(S, { tyre: ty, lift, bodyLift: bl, wheel: wh });
  document.getElementById('flags').innerHTML = fl.map(f =>
    `<div class="flag ${f.level}"><b>${{error:'不相容',warn:'注意',info:'提醒'}[f.level]}</b>${f.msg}</div>`).join('');
}

function buildUI() {
  const money = (p, c) => p == null ? '' : (c === 'JPY' ? '¥' : c === 'AUD' ? 'A$' : c === 'GBP' ? '£' : '$') + p.toLocaleString();
  const opt = (l, v, f) => document.getElementById(l).innerHTML =
    v.map(o => `<option value="${o.id}"${o.id === f ? ' selected' : ''}>${o.__l(o)}</option>`).join('');
  LIFTS.forEach(o => o.__l = x => x.label + (x.price ? ' — ' + money(x.price, x.cur) : ''));
  WHEELS.forEach(o => o.__l = x => `${x.label} (${x.rim}×${x.width}J ET${x.offset > 0 ? '+' : ''}${x.offset})`);
  TYRES.forEach(o => o.__l = x => `${x.label} — Ø${x.dia}mm`);
  // lifts grouped by inch class
  document.getElementById('selLift').innerHTML = [...new Set(LIFTS.map(l => l.inch))].map(cls =>
    `<optgroup label="${cls === '原廠' ? '原廠' : cls + ' 舉升'}">` + LIFTS.filter(l => l.inch === cls).map(o =>
      `<option value="${o.id}"${o.id === S.lift ? ' selected' : ''}>${o.__l(o)}</option>`).join('') + '</optgroup>').join('');
  FRONT_BUMPERS.forEach(o => o.__l = x => x.label + (x.price ? ' — ' + money(x.price, x.cur) : ''));
  GRILLES.forEach(o => o.__l = x => x.label + (x.price ? ' — ' + money(x.price, x.cur) : ''));
  REAR_BUMPERS.forEach(o => o.__l = x => x.label + (x.price ? ' — ' + money(x.price, x.cur) : ''));
  KITS.forEach(o => o.__l = x => x.label + (x.price ? ' — ' + money(x.price, x.cur) : ''));
  opt('selKit', KITS, S.kit); opt('selBumper', FRONT_BUMPERS, S.frontBumper); opt('selGrille', GRILLES, S.grille); opt('selRear', REAR_BUMPERS, S.rearBumper);
  SNORKELS.forEach(o => o.__l = x => x.label + (x.price ? ' — ' + money(x.price, x.cur) : ''));
  MIRRORS.forEach(o => o.__l = x => x.label + (x.price ? ' — ' + money(x.price, x.cur) : ''));
  opt('selSnorkel', SNORKELS, S.snorkel); opt('selMirror', MIRRORS, S.mirrors);
  for (const L of [ROOF_RACKS, AWNINGS, SIDE_STEPS, LADDERS]) L.forEach(o => o.__l = x => x.label + (x.price ? ' — ' + money(x.price, x.cur) : ''));
  opt('selRack', ROOF_RACKS, S.roofRack); opt('selAwning', AWNINGS, S.awning); opt('selStep', SIDE_STEPS, S.sideStep); opt('selLadder', LADDERS, S.ladder);
  opt('selWheel', WHEELS, S.wheel); opt('selTyre', TYRES, S.tyre);
  document.getElementById('selTread').innerHTML = ['at', 'rt', 'mt'].map(p =>
    `<optgroup label="${{ at: 'A/T 全地形', rt: 'R/T 混合地形', mt: 'M/T 泥地' }[p]}">` +
    TYRE_MODELS.filter(t => t.pattern === p).map(t =>
      `<option value="${t.id}"${t.id === S.tread ? ' selected' : ''}>${t.label}</option>`).join('') + '</optgroup>').join('');
  document.getElementById('selColor').innerHTML = COLORS.map(c =>
    `<option value="${c.code}"${c.code === S.color ? ' selected' : ''}>${c.code} ${c.name}</option>`).join('');
  document.getElementById('colSw').innerHTML = COLORS.map(c =>
    `<button class="sw" data-c="${c.code}" title="${c.name}" aria-pressed="${c.code === S.color}"
      style="background:#${c.hex.toString(16).padStart(6,'0')}"></button>`).join('');
  const TG = [['pillarPods','A 柱小圓燈'],['windowGuards','鐵窗（WLM）'],['guardCan','右鐵窗：油桶＋斧頭'],['guardBoard','左鐵窗：脫困板'],['shovel','車頂架鏟子'],
    ['flares','輪弧鉚釘'],['sideSkirt','側裙飾板（SHOWA）'],['decals','車門貼字'],['lightBar','車頂燈條'],['roofLights','車頂圓燈'],['spareBag','備胎書包'],['spareCover','備胎硬殼蓋']];
  document.getElementById('toggles').innerHTML =
    '' +
    TG.map(([k, l]) => `<button class="tg" data-k="${k}" aria-pressed="false"><span class="nm">${l}</span><span class="st">未裝</span></button>`).join('');
  document.getElementById('rimSw').innerHTML = RIMS.map(h =>
    `<button class="sw" data-r="${h}" aria-pressed="${h === S.rimColor}"
      style="background:#${h.toString(16).padStart(6, '0')}"></button>`).join('');
  document.getElementById('views').innerHTML = VIEWS.map((v, i) =>
    `<button data-v="${i}" aria-pressed="${i === 0}">${v[0]}</button>`).join('');
  hints();

  document.getElementById('selTread').onchange = e => { S.tread = e.target.value; hints(); update(); };
  document.getElementById('tgOwl').onclick = e => { S.owl = !S.owl;
    e.currentTarget.setAttribute('aria-pressed', S.owl);
    e.currentTarget.querySelector('.st').textContent = S.owl ? '開啟' : '關閉'; update(); };
  document.getElementById('rimSw').onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    S.rimColor = +b.dataset.r;
    document.querySelectorAll('[data-r]').forEach(x => x.setAttribute('aria-pressed', x === b));
    update();
  };

  const on = (id, f) => document.getElementById(id).onchange = e => { f(e.target.value); hints(); update(); };
  on('selLift', v => S.lift = v); on('selTyre', v => S.tyre = v);
  document.getElementById('selKit').onchange = e => {
    S.kit = e.target.value;
    const k = find(KITS, S.kit);
    if (k && k.set) Object.assign(S, k.set);
    buildUI(); hints(); update();
  };
  const panel = (id, key) => document.getElementById(id).onchange = e => {
    S[key] = e.target.value;
    if (S.kit !== 'none') { S.kit = 'none'; document.getElementById('selKit').value = 'none'; }
    hints(); update();
  };
  panel('selBumper', 'frontBumper'); panel('selGrille', 'grille'); panel('selRear', 'rearBumper');
  on('selSnorkel', v => S.snorkel = v); on('selMirror', v => S.mirrors = v);
  on('selRack', v => S.roofRack = v); on('selAwning', v => S.awning = v); on('selStep', v => S.sideStep = v); on('selLadder', v => S.ladder = v);
  document.getElementById('tgAwnSide').onclick = e => { S.awningSide = S.awningSide === 'left' ? 'right' : 'left'; syncToggles(); update(); };
  document.getElementById('btnDemo').onclick = () => { S = { ...DEF, ...DEMO }; buildUI(); hints(); update(); };
  syncToggles();
  document.getElementById('selWheel').onchange = e => {
    const w = find(WHEELS, e.target.value), t = find(TYRES, S.tyre);
    S.wheel = e.target.value;
    if (t.rim !== w.rim) { const nt = TYRES.find(x => x.rim === w.rim); if (nt) { S.tyre = nt.id; document.getElementById('selTyre').value = nt.id; } }
    hints(); update();
  };
  document.getElementById('selColor').onchange = e => { S.color = e.target.value;
    document.querySelectorAll('[data-c]').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === S.color)); update(); };
  document.getElementById('colSw').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return;
    S.color = b.dataset.c; document.getElementById('selColor').value = S.color;
    document.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); update(); };
  document.getElementById('tgTwo').onclick = e => { S.twoTone = !S.twoTone;
    e.currentTarget.setAttribute('aria-pressed', S.twoTone);
    e.currentTarget.querySelector('.st').textContent = S.twoTone ? '開啟' : '關閉'; update(); };
  document.getElementById('toggles').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    { const k = b.dataset.k; if (!k) return; S[k] = !S[k];
      // a bag and a hard cover cannot both sit on the spare
      const other = { spareBag: 'spareCover', spareCover: 'spareBag' }[k];
      if (other && S[k] && S[other]) S[other] = false;
    }
    syncToggles();
    update();
  };
  document.querySelectorAll('.sec-h').forEach(h => h.onclick = () => {
    const o = h.getAttribute('aria-expanded') === 'true';
    document.querySelectorAll('.sec-h').forEach(x => x.setAttribute('aria-expanded', 'false'));
    h.setAttribute('aria-expanded', String(!o));
  });
  document.getElementById('views').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return;
    document.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b));
    const [, az, el, d] = VIEWS[+b.dataset.v]; orbit.az = az; orbit.el = el; orbit.dist = d; applyCam(); };
  document.getElementById('btnReset').onclick = () => location.reload();
  document.getElementById('btnExport').onclick = () => {
    const lift = find(LIFTS, S.lift), bl = { body: lift.body ?? 0, label: '' };
    const wh = find(WHEELS, S.wheel), ty = find(TYRES, S.tyre);
    const col = COLORS.find(c => c.code === S.color);
    const acc = [S.frontBumper !== 'stock' && '前保桿 ' + find(FRONT_BUMPERS, S.frontBumper).label,
      S.roofRack !== 'none' && '車頂架 ' + find(ROOF_RACKS, S.roofRack).label, S.awning !== 'none' && '車邊帳 ' + find(AWNINGS, S.awning).label + (S.awningSide === 'left' ? '（左）' : '（右）'),
      S.grille !== 'stock' && '水箱護罩 ' + find(GRILLES, S.grille).label,
      S.snorkel !== 'none' && '呼吸管 ' + find(SNORKELS, S.snorkel).label, S.mirrors !== 'stock' && '後照鏡 ' + find(MIRRORS, S.mirrors).label,
      S.pillarPods && 'A 柱小圓燈', S.sideStep !== 'none' && '側踏 ' + find(SIDE_STEPS, S.sideStep).label, S.ladder !== 'none' && '後爬梯 ' + find(LADDERS, S.ladder).label, S.windowGuards && '鐵窗', S.guardCan && '右鐵窗油桶斧頭', S.guardBoard && '左鐵窗脫困板', S.shovel && '車頂鏟子',
      S.flares && '輪弧鉚釘', S.sideSkirt && '側裙飾板', S.decals && '車門貼字', S.lightBar && '車頂燈條', S.roofLights && '車頂圓燈', S.spareBag && '備胎書包', S.spareCover && '備胎硬殼蓋',
      S.rearBumper !== 'stock' && '後保桿 ' + find(REAR_BUMPERS, S.rearBumper).label].filter(Boolean);
    const fl = validate(S, { tyre: ty, lift, bodyLift: bl, wheel: wh });
    const o = document.getElementById('out');
    o.textContent = ['JIMNY JB74 改裝配置', '─'.repeat(28),
      `車色    ${col.code} ${col.name}${S.twoTone ? '（雙色黑頂）' : ''}`,
      `懸吊    ${lift.label}`, bl.body ? `車身舉升 ${bl.label}` : null,
      `輪框    ${wh.label}`, `輪胎    ${ty.label} Ø${ty.dia}mm`, '',
      `總舉升  ${lift.lift + bl.body}mm`,
      `估離地  ${210 + lift.lift + bl.body + Math.round((ty.dia - 693) / 2)}mm`, '',
      acc.length ? '配件\n' + acc.map(a => '  · ' + a).join('\n') : '配件    無',
      fl.length ? '\n注意\n' + fl.map(f => '  ! ' + f.msg).join('\n') : '',
      '', '※ 價格為概略值，實際以代理商報價為準。'].filter(x => x !== null).join('\n');
    o.classList.add('on'); o.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
}
function hints() {
  const n = o => [o.brand && o.brand !== '—' ? o.brand : '', o.note || '', o.uncertain ? '（未完全查證）' : ''].filter(Boolean).join(' · ');
  document.getElementById('hLift').textContent = n(find(LIFTS, S.lift));
  document.getElementById('hWheel').textContent = n(find(WHEELS, S.wheel));
  document.getElementById('hTyre').textContent = n(find(TYRES, S.tyre));
  document.getElementById('hKit').textContent = n(find(KITS, S.kit));
  document.getElementById('hBumper').textContent = n(find(FRONT_BUMPERS, S.frontBumper));
  document.getElementById('hGrille').textContent = n(find(GRILLES, S.grille));
  document.getElementById('hRear').textContent = n(find(REAR_BUMPERS, S.rearBumper));
  document.getElementById('hSnorkel').textContent = n(find(SNORKELS, S.snorkel));
  document.getElementById('hMirror').textContent = n(find(MIRRORS, S.mirrors));
  document.getElementById('hRack').textContent = n(find(ROOF_RACKS, S.roofRack));
  document.getElementById('hAwning').textContent = n(find(AWNINGS, S.awning));
  document.getElementById('hStep').textContent = n(find(SIDE_STEPS, S.sideStep));
  document.getElementById('hLadder').textContent = n(find(LADDERS, S.ladder));
  const tm = find(TYRE_MODELS, S.tread);
  document.getElementById('hTread').textContent = tm.note || '';
  document.getElementById('owlNote').textContent = tm.owl ? '此型號有白字版本' : '此型號原廠無白字版本（僅示意）';
}

resize(); applyCam();
(function loop() { if (composer) composer.render(); else renderer.render(scene, cam); requestAnimationFrame(loop); })();
new ResizeObserver(resize).observe(cv.parentElement);
</script>
</body>
