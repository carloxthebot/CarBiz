<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarBiz — 改裝零件價格研究</title>
<style>
:root { --bg:#f7f8fa; --card:#fff; --ink:#14161a; --dim:#616a76; --line:#e3e6eb; --accent:#0b64c8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#0e1013; --card:#15181d; --ink:#e8eaed; --dim:#98a1ad;
    --line:#252a31; --accent:#5aa9f8; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:18px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC",
  "PingFang TC","Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
.page { max-width:820px; margin:0 auto; padding:80px 24px 100px; }
h1 { font-size:38px; letter-spacing:-.02em; margin:0 0 10px; }
.sub { color:var(--dim); margin:0 0 48px; }
a.card { display:block; text-decoration:none; color:inherit; background:var(--card);
  border:1px solid var(--line); border-radius:14px; padding:26px 28px; margin-bottom:16px; }
a.card:hover { border-color:var(--accent); }
a.card h2 { margin:0 0 8px; font-size:24px; letter-spacing:-.01em; }
a.card p { margin:0 0 14px; color:var(--dim); font-size:16px; }
.facts { display:flex; flex-wrap:wrap; gap:8px; }
.fact { font-size:14px; color:var(--dim); border:1px solid var(--line); border-radius:999px;
  padding:3px 12px; }
footer { margin-top:56px; color:var(--dim); font-size:15px; }
footer a { color:var(--accent); }
</style>
</head>
<body>
<div class="page">
  <h1>CarBiz</h1>
  <p class="sub">改裝零件的價格研究：同一顆零件，在日本定價多少、當地賣多少、自己進要多少。</p>

  <a class="card" href="blitz-gr86/">
    <h2>BLITZ × GR86 (ZN8) 四地價格對照 🇯🇵 🇹🇭 🇲🇾 🇸🇬 🇭🇰</h2>
    <p>BLITZ 為 Toyota GR86／ZN8 出的全部 110 個品項，附日本定價、泰馬新港四地查到的零售標價，
       以及每個品項的水貨到岸試算。附各地通路、關稅稅制與改裝法規。</p>
    <div class="facts">
      <span class="fact">110 品項</span>
      <span class="fact">41 條產品線</span>
      <span class="fact">31 筆實際零售標價</span>
      <span class="fact">102 料號 × 4 地到岸試算</span>
    </div>
  </a>

  <footer>
    資料與產生腳本都在 <a href="https://github.com/carloxthebot/CarBiz" rel="noopener">GitHub</a>。
    價格為查訪當日的公開標價，試算值一律標示，查不到的一律留白。
  </footer>
</div>
</body>
</html>
